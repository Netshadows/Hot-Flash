<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hot Flash - Symptom Tracker</title>

    <!-- PWA / Native Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Dynamic Header -->
        <header class="app-header">
            <h1 id="page-title">Dashboard</h1>
            <div class="header-actions">
                <!-- Placeholder for profile/settings -->
                <div class="user-avatar" onclick="if(window.app.currentRoute!=='login') window.app.navigate('settings')"></div>
                <button onclick="window.logout()" id="logout-btn" style="display:none; margin-left:12px; border:none; background:transparent; color:var(--color-primary); font-size:14px; font-weight:600; cursor:pointer;">Logout</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="content-area">
            <!-- Views will be injected here by app.js -->
        </main>

        <!-- Bottom Navigation (Mobile Style) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-target="dashboard">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Home</span>
            </button>
            <button class="nav-item fab-wrapper" data-target="logging">
                <div class="fab">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
            </button>
            <button class="nav-item" data-target="resources">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span>Learn</span>
            </button>
        </nav>
    </div>

    <!-- Firebase 10 Compat (Allows drop-in scripts without bundle) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <!-- Scripts: Loaded sequentially to avoid module/CORS issues on local file access -->
    <script src="js/components/dashboard.js"></script>
    <script src="js/components/logging.js"></script>
    <script src="js/components/resources.js"></script>
    <script src="js/components/settings.js"></script>
    <script src="js/components/login.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
